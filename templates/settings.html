{{define "content"}}
<div class="settings-container">
    <div class="settings-card">
        <h1>Account settings</h1>
        <p class="settings-email">{{.Account.Email}}</p>
        {{if .Error}}<div class="error-notification" role="alert">{{.Error}}</div>{{end}}
        {{if .Success}}<div class="success-notification" role="status">{{.Success}}</div>{{end}}
        <form method="POST" action="/settings" class="settings-form">
            <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
            <fieldset>
                <legend>Profile</legend>
                <label for="display_name">Display name</label>
                <input id="display_name" name="display_name" type="text" maxlength="100" value="{{.Account.DisplayName}}" autocomplete="name">
            </fieldset>
            <fieldset>
                <legend>Change password</legend>
                <p>Leave these fields empty to keep your current password.</p>
                <label for="current_password">Current password</label>
                <input id="current_password" name="current_password" type="password" autocomplete="current-password">
                <label for="new_password">New password</label>
                <input id="new_password" name="new_password" type="password" minlength="12" autocomplete="new-password">
                <label for="confirm_password">Confirm new password</label>
                <input id="confirm_password" name="confirm_password" type="password" minlength="12" autocomplete="new-password">
            </fieldset>
            <button type="submit" class="btn btn-primary">Save settings</button>
        </form>
    </div>
</div>
{{end}}
